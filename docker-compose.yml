services:
  db:
    image: postgres:17
    container_name: taskdb
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks
    volumes:
      - taskdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: task-api
    restart: always
    depends_on:
      - db
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/tasks
      PORT: 3000

volumes:
  taskdata: